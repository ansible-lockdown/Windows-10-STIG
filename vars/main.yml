  - { IdentityReference: "APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES", RegistryRights: "ReadKey", AccessControlType: "Allow", IsInherited: false, InheritanceFlags: "ContainerInherit", PropagationFlags: "None" }

# This setting requires v1903 or later of Windows 10; it is NA for prior versions.  The setting is NA when the “Allow voice activation” policy is
# configured to disallow applications to be activated with voice for all users.
# - ansible_facts['distribution_version'] >= "10.0.1903.0"
- name: "MEDIUM | WN10-CC-000365 | PATCH | Windows 10 must be configured to prevent Windows apps from being activated by voice while the system is locked."
  when:
    - wn10_cc_000365 | bool
    - ansible_facts['distribution_version'] >= "10.0.1903.0"
  tags:
    - WN10-CC-000365
    - CAT2
    - CCI-000056
    - SRG-OS-000028-GPOS-00009
    - SV-220869r958400_rule
    - V-220869
    - NIST800-53_AC-11_b
    - NIST800-53A_AC-11.1_iii
    - NIST800-53R4_AC-11_b
  block:
    - name: "MEDIUM | WN10-CC-000365 | AUDIT | Windows 10 must be configured to prevent Windows apps from being activated by voice while the system is locked. | Check for LetAppsActivateWithVoice"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy\
        name: LetAppsActivateWithVoice
      register: discovered_cc_000365_let_apps_activate_with_voice

    - name: "MEDIUM | WN10-CC-000365 | PATCH | Windows 10 must be configured to prevent Windows apps from being activated by voice while the system is locked. | Apply Registry Setting"
      when: not discovered_cc_000365_let_apps_activate_with_voice.exists | default(false) or discovered_cc_000365_let_apps_activate_with_voice.value | int != 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name: LetAppsActivateWithVoiceAboveLock
        data: 2
        type: dword


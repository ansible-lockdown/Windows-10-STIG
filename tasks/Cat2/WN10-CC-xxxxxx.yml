- name: "MEDIUM | WN10-CC-000204 | PATCH | If Enhanced diagnostic data is enabled it must be limited to the minimum required to support Windows Analytics."
  when:
    - wn10_cc_000204 | bool
    - ansible_facts['distribution_version'] >= "10.0.1709.0"
  tags:
    - WN10-CC-000204

  tags:
    - WN10-CC-000060
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220807r991589_rule
    - V-220807
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy
    name: fBlockNonDomain
    data: 1
    type: dword

# This functionality has been removed in Windows 10 v1803 and newer and is not applicable to those newer versions
# Add the following to the when statement for Windows 10 ansible_facts['distribution_version'] <= "10.0.1803.0"
- name: "MEDIUM | WN10-CC-000065 | PATCH | Wi-Fi Sense must be disabled."
  when:
    - wn10_cc_000065 | bool

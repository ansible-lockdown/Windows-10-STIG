    - SV-220833r991589_rule
    - V-220833
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-CC-000204 | AUDIT | If Enhanced diagnostic data is enabled it must be limited to the minimum required to support Windows Analytics. | Get current Telemetry setting."
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name: AllowTelemetry
      register: discovered_cc_000204_telemetry_value

    - name: "MEDIUM | WN10-CC-000204 | PATCH | If Enhanced diagnostic data is enabled it must be limited to the minimum required to support Windows Analytics. | Set Registry If Set To Full."
      when:
        - discovered_cc_000204_telemetry_value.exists | default(false)
        - discovered_cc_000204_telemetry_value.value | int == 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name: LimitEnhancedDiagnosticDataWindowsAnalytics
        data: 1
        type: dword


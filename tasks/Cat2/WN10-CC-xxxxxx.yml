# This control is not applicable to Windows 10 version 1507 and 1607
# Add the following to the when statement for Windows 10
#     - ansible_facts['distribution_version'] != "10.0.1507.0" or
#       ansible_facts['distribution_version'] != "10.0.1607.0"
- name: "MEDIUM | WN10-CC-000068 | PATCH | Windows 10 must be configured to enable Remote host allows delegation of non-exportable credentials."
  when:
    - wn10_cc_000068 | bool
    - ansible_facts['distribution_version'] != "10.0.1507.0" or ansible_facts['distribution_version'] != "10.0.1607.0"
  tags:
    - WN10-CC-000068
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220810r991589_rule
    - V-220810
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation
    name: AllowProtectedCreds
    data: 1
    type: dword

- name: "MEDIUM | WN10-CC-000070 | PATCH | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection."
  when:
    - wn10_cc_000070 | bool
    - not discovered_vdi_non_persistent | bool
  tags:
    - WN10-CC-000070
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220811r1016359_rule
    - V-220811
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-CC-000070 | PATCH | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Set virtualization-based Security enabled."
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
        name: EnableVirtualizationBasedSecurity
        data: 1
        type: dword

    - name: "MEDIUM | WN10-CC-000070 | PATCH | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Set Variable For Secure Boot."
      when: win10stig_enable_virtualization_based_security == 1 or win10stig_enable_virtualization_based_security == 3
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
        name: RequirePlatformSecurityFeatures
        data: "{{ win10stig_enable_virtualization_based_security }}"
        type: dword

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Warning Check For Variable Standards."
      when:
        - win10stig_enable_virtualization_based_security != 1
        - win10stig_enable_virtualization_based_security != 3
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win10stig_enable_virtualization_based_security. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Warning Count."
      when:
        - win10stig_enable_virtualization_based_security != 1
        - win10stig_enable_virtualization_based_security != 3
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN10-CC-000070'

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check Secure Boot status"
      ansible.windows.win_shell: Confirm-SecureBootUEFI
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_secure_boot_status

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check Virtualization-Based Security (VBS) status"
      ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).VirtualizationBasedSecurityStatus
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_vbs_status

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check if Device Guard is running"
      ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).SecurityServicesRunning
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_device_guard_status

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check if Hyper-V is installed"
      ansible.windows.win_shell: Get-WindowsOptionalFeature -FeatureName Microsoft-Hyper-V-All -Online | Select-Object -ExpandProperty State
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_hyper_v_status

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check if CPU supports DMA Protection (IOMMU)"
      ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).AvailableSecurityProperties
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_dma_protection_status

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Display results and warnings"
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════"
          - "   Virtualization-Based Security (VBS) Check Results   "
          - "═══════════════════════════════════════════════════════"
          - "Secure Boot Enabled   : {{ 'Yes' if discovered_cc_000070_secure_boot_status.stdout == 'True' else 'No (Finding)' }}"
          - "VBS Running           : {{ 'Yes' if discovered_cc_000070_vbs_status.stdout | int == 2 else 'No (Finding)' }}"
          - "Device Guard Running  : {{ 'Yes' if '1' in discovered_cc_000070_device_guard_status.stdout else 'No (Finding)' }}"
          - "Hyper-V Installed     : {{ 'Yes' if 'Enabled' in discovered_cc_000070_hyper_v_status.stdout else 'No (Finding)' }}"
          - "DMA Protection        : {{ 'Yes' if '3' in discovered_cc_000070_dma_protection_status.stdout else 'No (Hardware Limitation?)' }}"
          - "═══════════════════════════════════════════════════════"

    - name: "MEDIUM | WN10-CC-000070 | AUDIT | Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Warning Count."
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN10-CC-000070'

- name: "MEDIUM | WN10-CC-000085 | PATCH | Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent boot drivers."
  when: wn10_cc_000085 | bool
  tags:
    - WN10-CC-000085
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220813r991589_rule
    - V-220813
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-CC-000085 | PATCH | Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent boot drivers. | Apply registry settings."
      when: win10stig_boot_driver_init_policy == 1 or win10stig_boot_driver_init_policy == 3 or win10stig_boot_driver_init_policy == 8
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Policies\EarlyLaunch
        name: DriverLoadPolicy
        data: "{{ win10stig_boot_driver_init_policy }}"
        type: dword


- name: "MEDIUM | WN10-CC-000391 | PATCH | Internet Explorer must be disabled for Windows 10."
  when: wn10_cc_000391 | bool
  tags:
    - WN10-CC-000391
    - CAT2
    - CCI-000366
    - SRG-OS-000185-GPOS-00079
    - SV-256894r958552_rule
    - V-256894
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-CC-000391 | AUDIT | Internet Explorer must be disabled for Windows 10. | Get Windows Edition"
      ansible.windows.win_shell: (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion").EditionID
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000391_os_edition_check

    - name: "MEDIUM | WN10-CC-000391 | PATCH | Internet Explorer must be disabled for Windows 10. | Set fact"
      ansible.builtin.set_fact:
        discovered_cc_000391_is_semi_annual_channel: "{{ discovered_cc_000391_os_edition_check.stdout not in ['EnterpriseS', 'IoTEnterprise', 'ServerDatacenter', 'ServerStandard'] }}"

    - name: "MEDIUM | WN10-CC-000391 | PATCH | Internet Explorer must be disabled for Windows 10. | Disable IE11 as a standalone browser"
      when: discovered_cc_000391_is_semi_annual_channel
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Main
        name: DisableIE
        data: 1
        type: dword

    - name: "MEDIUM | WN10-CC-000391 | PATCH | Internet Explorer must be disabled for Windows 10. | Remove IE11 Windows Feature"
      # win_feature wraps ServerManager and its own docs say it is unavailable on client OSes,
      # so it cannot run on Windows 10. IE is also absent entirely from current builds, hence
      # the presence gate - without it the task raises "Failed to find feature".
      when:
        - discovered_cc_000391_is_semi_annual_channel
        - win10stig_remove_internet_explorer_11 | bool
        - "'Internet-Explorer-Optional-amd64' in discovered_feature_names"
      ansible.windows.win_optional_feature:
        name: Internet-Explorer-Optional-amd64
        state: absent

- name: "MEDIUM | WN10-CC-000063 | AUDIT | Windows 10 systems must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance."
  when:
    - wn10_cc_000063 | bool
    - discovered_domain_joined | bool
  tags:
    - WN10-CC-000063
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-268319r1135263_rule
    - V-268319
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-CC-000063 | AUDIT | Windows 10 systems must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance. | Check if system is receiving GPO using gpresult"
      ansible.windows.win_shell: gpresult /R
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000063_gpresult_check

    - name: "MEDIUM | WN10-CC-000063 | AUDIT | Windows 10 systems must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance. | Check if device is MDM enrolled via registry"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Microsoft\Enrollments
      register: discovered_cc_000063_mdm_registry_check

    - name: "MEDIUM | WN10-CC-000063 | AUDIT | Windows 10 systems must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance. | Set fact for managed system"
      ansible.builtin.set_fact:
        discovered_cc_000063_system_managed: "{{ 'Group Policy Objects' in discovered_cc_000063_gpresult_check.stdout or discovered_cc_000063_mdm_registry_check.exists }}"

    - name: "MEDIUM | WN10-CC-000063 | AUDIT | Windows 10 systems must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance. | Management Compliance Result"
      when: not discovered_cc_000063_system_managed
      ansible.builtin.debug:
        msg:
          - "Warning!! The system must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance."
          - "Configure the Windows 10 system to use either Group Policy or an approved MDM product to enforce STIG compliance."

    - name: "MEDIUM | WN10-CC-000063 | AUDIT | Windows 10 systems must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance. | Warn Count."
      when: not discovered_cc_000063_system_managed
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-CC-000063'

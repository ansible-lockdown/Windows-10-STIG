    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220796r991589_rule
    - V-220796
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b

- name: "MEDIUM | WN10-CC-000037 | PATCH | Local administrator accounts must have their privileged token filtered to prevent elevated privileges from being used over the network on domain systems."
  when:
    - wn10_cc_000037 | bool
    - discovered_domain_joined | bool
    - not win_skip_for_test
    # Skipped automatically when the run itself is a local account over a network logon
    # transport, because applying this severs that connection. See the note in prelim.yml.
    - not discovered_local_account_network_logon | bool
  tags:
    - WN10-CC-000037
    - CAT2
    - CCI-001084
    - SRG-OS-000134-GPOS-00068
    - SV-220799r958518_rule
    - V-220799
    - NIST800-53_SC-3
    - NIST800-53A_SC-3.1_ii
    - NIST800-53R4_SC-3
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 0
    type: dword

- name: "MEDIUM | WN10-CC-000038 | PATCH | WDigest Authentication must be disabled."
  when: wn10_cc_000038 | bool
  tags:
    - WN10-CC-000038
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-220800r958478_rule
    - V-220800
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest
    name: UseLogonCredential
    data: 0
    type: dword

- name: "MEDIUM | WN10-CC-000039 | PATCH | Run as different user must be removed from context menus."
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Classes\{{ item }}\shell\runasuser
    name: SuppressionPolicy
    data: 4096
    type: dword
  with_items:
    - batfile
    - cmdfile
    - exefile
    - mscfile
  when: wn10_cc_000039 | bool
  tags:
    - WN10-CC-000039
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-220801r958478_rule
    - V-220801
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a

- name: "MEDIUM | WN10-CC-000040 | PATCH | Insecure logons to an SMB server must be disabled."
  when: wn10_cc_000040 | bool
  tags:

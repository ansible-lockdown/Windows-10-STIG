---

- name: "MEDIUM | WN10-SO-000010 | PATCH | The built-in guest account must be disabled."
  when:
    - wn10_so_000010 | bool
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN10-SO-000010
    - CAT2
    - CCI-000804
    - SRG-OS-000121-GPOS-00062
    - SV-220909r958504_rule
    - V-220909
    - NIST800-53_IA-8
    - NIST800-53A_IA-8.1
    - NIST800-53R4_IA-8
  community.windows.win_security_policy:
    section: System Access
    key: EnableGuestAccount
    value: 0

- name: "MEDIUM | WN10-SO-000015 | PATCH | Local accounts with blank passwords must be restricted to prevent access from the network."
  when: wn10_so_000015 | bool
  tags:
    - WN10-SO-000015
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220910r991589_rule
    - V-220910
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: LimitBlankPasswordUse
    data: 1
    type: dword

- name: "MEDIUM | WN10-SO-000020 | PATCH | The built-in administrator account must be renamed."
  when:
    - wn10_so_000020 | bool
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN10-SO-000020
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220911r991589_rule
    - V-220911
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-SO-000020 | PATCH | The built-in administrator account must be renamed. | Change Admin Name."
      when: "'adminchangethis' not in win10stig_admin_username"
      community.windows.win_security_policy:
        section: System Access
        key: NewAdministratorName
        value: "{{ win10stig_admin_username }}"

    - name: "MEDIUM | WN10-SO-000020 | AUDIT | The built-in administrator account must be renamed. | Warning Msg For Default Variable Not Edited."
      when: "'adminchangethis' in win10stig_admin_username"
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not changed the default admin username in win10stig_admin_username please"
          - "make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN10-SO-000020 | AUDIT | The built-in administrator account must be renamed. | Add Warn Count."
      when: "'adminchangethis' in win10stig_admin_username"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN10-SO-000020'

- name: "MEDIUM | WN10-SO-000025 | PATCH | The built-in guest account must be renamed."
  when:
    - wn10_so_000025 | bool
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN10-SO-000025
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220912r991589_rule
    - V-220912
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-SO-000025 | PATCH | The built-in guest account must be renamed. | Change Guest Name."
      when: "'guestchangethis' not in win10stig_guest_username"
      community.windows.win_security_policy:
        section: System Access
        key: NewGuestName
        value: "{{ win10stig_guest_username }}"

    - name: "MEDIUM | WN10-SO-000025 | AUDIT | The built-in guest account must be renamed. | Warning Msg For Default Variable Not Edited."
      when: "'guestchangethis' in win10stig_guest_username"
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not changed the default guest name in win10stig_guest_username please"
          - "make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN10-SO-000025 | AUDIT | The built-in guest account must be renamed. | Add Warn Count."
      when: "'guestchangethis' in win10stig_guest_username"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN10-SO-000025'


- name: "MEDIUM | WN10-SO-000095 | PATCH | The Smart Card removal option must be configured to Force Logoff or Lock Workstation."
  when: wn10_so_000095 | bool
  tags:
    - WN10-SO-000095
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220924r991589_rule
    - V-220924
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-SO-000095 | PATCH | The Smart Card removal option must be configured to Force Logoff or Lock Workstation. | Apply Variable To Registry."
      when:
        - win10stig_sc_remove_option >= 1
        - win10stig_sc_remove_option <= 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name: SCRemoveOption
        data: "{{ win10stig_sc_remove_option }}"
        type: string

    - name: "MEDIUM | WN10-SO-000095 | AUDIT | The Smart Card removal option must be configured to Force Logoff or Lock Workstation. | Warning Check For Variable Standards."
      when: win10stig_sc_remove_option < 1 or win10stig_sc_remove_option > 2
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win10stig_sc_remove_option. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN10-SO-000095 | AUDIT | The Smart Card removal option must be configured to Force Logoff or Lock Workstation. | Warn Count."
      when: win10stig_sc_remove_option < 1 or win10stig_sc_remove_option > 2
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN10-SO-000095'


- name: "MEDIUM | WN10-SO-000251 | PATCH | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts."
  when: wn10_so_000251 | bool
  tags:
    - WN10-SO-000251
    - CAT2
    - CCI-000765
    - SRG-OS-000105-GPOS-00052
    - SV-220946r1153410_rule
    - V-220946
    - NIST800-53_IA-2_1
    - NIST800-53A_IA-2_1.1
    - NIST800-53R4_IA-2_1
  block:
    - name: "MEDIUM | WN10-SO-000251 | PATCH | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Ensure Smart Card Readers Registry Key Exists"
      when: discovered_domain_joined
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Cryptography\Calais\Readers
        state: present

    - name: "MEDIUM | WN10-SO-000251 | PATCH | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Ensure Smart Cards Registry Key Exists"
      when: discovered_domain_joined
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Cryptography\Calais\SmartCards
        state: present

    - name: "MEDIUM | WN10-SO-000251 | AUDIT | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Check Smart Card Readers Registry Key"
      when: discovered_domain_joined
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Microsoft\Cryptography\Calais\Readers
      register: discovered_so_000251_smartcard_readers_check

    - name: "MEDIUM | WN10-SO-000251 | AUDIT | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Check Smart Cards Registry Key"
      when: discovered_domain_joined
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Microsoft\Cryptography\Calais\SmartCards
      register: discovered_so_000251_smartcards_check

    - name: "MEDIUM | WN10-SO-000251 | AUDIT | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Determine if Registry Keys are Populated"
      when: discovered_domain_joined
      ansible.builtin.set_fact:
        # sub_keys, not values. win_reg_stat returns exists, properties and sub_keys; there is no
        # values field, and because the register is a dict, .values silently resolves to the Python
        # dict method instead of raising, so the mistake only surfaces when a filter is applied to
        # it - "object of type 'method' has no len()". Calais\Readers and Calais\SmartCards carry
        # one sub-key per reader or card, so sub_keys is what "populated" means for this control.
        discovered_so_000251_smart_card_compliant: "{{
          discovered_so_000251_smartcard_readers_check.exists and discovered_so_000251_smartcards_check.exists and
          (discovered_so_000251_smartcard_readers_check.sub_keys | default([]) | length > 0) and
          (discovered_so_000251_smartcards_check.sub_keys | default([]) | length > 0) }}"

    - name: "MEDIUM | WN10-SO-000251 | AUDIT | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Display Compliance Results (Populated)"
      when:
        - discovered_domain_joined
        - discovered_so_000251_smart_card_compliant
      ansible.builtin.debug:
        msg:
          - "Warning!! Compliance Check Passed: Smart Card registry keys are present and populated."
          - "Please verify the settings meet your company standards for compliance."
          - "═══════════════════════════════════════════════════════"
          - "    Smartcard Readers Check Current Registry Values    "
          - "═══════════════════════════════════════════════════════"
          - "{{ discovered_so_000251_smartcard_readers_check.sub_keys | default([]) }}"
          - "═══════════════════════════════════════════════════════"
          - "          Smartcard Current Registry Values            "
          - "═══════════════════════════════════════════════════════"
          - "{{ discovered_so_000251_smartcards_check.sub_keys | default([]) }}"

    - name: "MEDIUM | WN10-SO-000251 | AUDIT | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Display Non-Compliance Results (Keys Exist but Are Not Populated)"
      when:
        - discovered_domain_joined
        - discovered_so_000251_smartcard_readers_check.exists or discovered_so_000251_smartcards_check.exists
        - not discovered_so_000251_smart_card_compliant
      ansible.builtin.debug:
        msg:
          - "Warning!! Smart Card registry keys are present but are NOT populated."
          - "This is a finding! Ensure these registry keys have valid settings."
          - "═══════════════════════════════════════════════════════"
          - "    Smartcard Readers Check Current Registry Values    "
          - "═══════════════════════════════════════════════════════"
          - "{{ discovered_so_000251_smartcard_readers_check.sub_keys | default([]) if discovered_so_000251_smartcard_readers_check.sub_keys | default([]) else 'Not Valid (Finding)' }}"
          - "═══════════════════════════════════════════════════════"
          - "          Smartcard Current Registry Values            "
          - "═══════════════════════════════════════════════════════"
          - "{{ discovered_so_000251_smartcards_check.sub_keys | default([]) if discovered_so_000251_smartcards_check.sub_keys | default([]) else 'Not Valid (Finding)' }}"

    - name: "MEDIUM | WN10-SO-000251 | AUDIT | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Warning Message."
      when: not discovered_domain_joined
      ansible.builtin.debug:
        msg:
          - "Warning!!"
          - "Check Text: If the system is not a member of a domain, this is Not Applicable."
          - "Fix Text: For non-domain joined systems, configuring Windows Hello for sign-on"
          - "options would be suggested based on the organization's needs and capabilities."
          - "We have decided to add this warning as a precaution based on STIG recommendations."

    - name: "MEDIUM | WN10-SO-000251 | PATCH | Windows 10 must use multifactor authentication for local and network access to privileged and nonprivileged accounts. | Warn Count."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-SO-000251'

- name: "MEDIUM | WN10-SO-000255 | PATCH | User Account Control must automatically deny elevation requests for standard users."
  when: wn10_so_000255 | bool
  tags:
    - WN10-SO-000255
    - CAT2
    - CCI-002038
    - SRG-OS-000373-GPOS-00157
    - SV-220947r1051036_rule
    - V-220947
    - NIST800-53R4_IA-11
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: ConsentPromptBehaviorUser
    data: 0
    type: dword

- name: "MEDIUM | WN10-SO-000260 | PATCH | User Account Control must be configured to detect application installations and prompt for elevation."
  when: wn10_so_000260 | bool
  tags:
    - WN10-SO-000260
    - CAT2
    - CCI-001084
    - SRG-OS-000134-GPOS-00068
    - SV-220948r958518_rule
    - V-220948
    - NIST800-53_SC-3
    - NIST800-53A_SC-3.1_ii
    - NIST800-53R4_SC-3
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableInstallerDetection
    data: 1
    type: dword

- name: "MEDIUM | WN10-SO-000265 | PATCH | User Account Control must only elevate UIAccess applications that are installed in secure locations."
  when: wn10_so_000265 | bool
  tags:
    - WN10-SO-000265
    - CAT2

- name: "MEDIUM | WN10-SO-000070 | PATCH | The machine inactivity limit must be set to 15 minutes, locking the system with the screensaver."
  when: wn10_so_000070 | bool
  tags:
    - WN10-SO-000070
    - CAT2
    - CCI-000057
    - SRG-OS-000029-GPOS-00010
    - SV-220920r958402_rule
    - V-220920
    - NIST800-53_AC-11_a
    - NIST800-53A_AC-11.1_ii
    - NIST800-53R4_AC-11_a
  block:
    - name: "MEDIUM | WN10-SO-000070 | PATCH | The machine inactivity limit must be set to 15 minutes, locking the system with the screensaver. | Set Registry Variable."
      when:
        - win10stig_inactivity_timeout_seconds <= 900
        - win10stig_inactivity_timeout_seconds > 0
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: InactivityTimeoutSecs
        data: "{{ win10stig_inactivity_timeout_seconds }}"
        type: dword

    - name: "MEDIUM | WN10-SO-000070 | AUDIT | The machine inactivity limit must be set to 15 minutes, locking the system with the screensaver. | Warning Check For Variable Standards."
      when: win10stig_inactivity_timeout_seconds > 900 or win10stig_inactivity_timeout_seconds == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of seconds set for win10stig_inactivity_timeout_seconds. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN10-SO-000070 | AUDIT | The machine inactivity limit must be set to 15 minutes, locking the system with the screensaver. | Warn Count."
      when: win10stig_inactivity_timeout_seconds > 900 or win10stig_inactivity_timeout_seconds == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN10-SO-000070'


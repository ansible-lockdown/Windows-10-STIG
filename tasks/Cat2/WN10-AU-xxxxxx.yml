- name: "MEDIUM | WN10-AU-000500 | PATCH | The Application event log size must be configured to 32768 KB or greater."
  when: wn10_au_000500 | bool
  tags:
    - WN10-AU-000500
    - CAT2
    - CCI-001849
    - SRG-OS-000341-GPOS-00132
    - SV-220779r958752_rule
    - V-220779
    - NIST800-53R4_AU-4
  block:
    - name: "MEDIUM | WN10-AU-000500 | PATCH | The Application event log size must be configured to 32768 KB or greater. | Set Variable"
      when: win10stig_application_max_log_file_size >= 32768
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application
        name: MaxSize
        data: "{{ win10stig_application_max_log_file_size }}"
        type: dword

    - name: "MEDIUM | WN10-AU-000500 | AUDIT | The Application event log size must be configured to 32768 KB or greater. | Warning Message"
      when: win10stig_application_max_log_file_size < 32768
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid file size set for win10stig_application_max_log_file_size. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN10-AU-000500 | AUDIT | The Application event log size must be configured to 32768 KB or greater. | Warn Count."
      when: win10stig_application_max_log_file_size < 32768
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN10-AU-000500'


    - name: "MEDIUM | WN10-AU-000005 | PATCH | The system must be configured to audit Account Logon - Credential Validation failures | Failures"
      when: "'Failure' not in discovered_ac_000040_audit.stdout"
      ansible.windows.win_shell: AuditPol /set /subcategory:"Credential Validation" /failure:enable


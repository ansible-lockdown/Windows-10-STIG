- name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts."
  when: wn10_au_000515 | bool
  tags:
    - WN10-AU-000515
    - CAT2
    - CCI-000162
    - CCI-000163
    - CCI-000164
    - SRG-OS-000057-GPOS-00027
    - SV-220782r958434_rule
    - V-220782
    - NIST800-53_AU-9
    - NIST800-53A_AU-9.1
    - NIST800-53R4_AU-9
  block:
    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Get Application Event Log File Location from Registry"
      ansible.windows.win_reg_stat:
        path: "HKLM:\\SYSTEM\\CurrentControlSet\\Services\\EventLog\\Application"
        name: "File"
      register: discovered_au_000515_detected_application_log

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Set a fact for the Application Event Log file location"
      ansible.builtin.set_fact:
        discovered_au_000515_application_event_log_location: "{{ discovered_au_000515_detected_application_log.value }}"

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Check if the log file location is default"
      ansible.builtin.set_fact:
        discovered_au_000515_is_default_location: "{{ discovered_au_000515_application_event_log_location == 'C:\\Windows\\system32\\winevt\\Logs\\Application.evtx' }}"

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Set the correct log file path based on default or non-default location"
      ansible.builtin.set_fact:
        discovered_au_000515_log_file_path: "{{ discovered_au_000515_application_event_log_location if discovered_au_000515_is_default_location == false else 'C:\\Windows\\system32\\winevt\\Logs\\Application.evtx' }}"

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Retrieve ACL entries for the Application event log"
      ansible.windows.win_shell: (Get-Acl "{{ discovered_au_000515_application_event_log_location }}").Access | ConvertTo-Json -Compress
      check_mode: false
      register: discovered_au_000515_app_event_log_acl_entries
      changed_when: false
      failed_when: false

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Parse ACL entries for further checks"
      ansible.builtin.set_fact:
        discovered_au_000515_parsed_acl_entries: "{{ discovered_au_000515_app_event_log_acl_entries.stdout | from_json }}"

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Set fact for authorized entries with proper rights (manual filtering)"
      ansible.builtin.set_fact:
        discovered_au_000515_authorized_entries: >-
          {%- set auth = [] -%}
          {%- for entry in discovered_au_000515_parsed_acl_entries -%}
            {%- if (entry.IdentityReference.Value in ['NT AUTHORITY\\SYSTEM', 'BUILTIN\\Administrators', 'NT SERVICE\\EventLog', 'NT Service\\Eventlog'] and entry.FileSystemRights == 2032127)
                  or (entry.IdentityReference.Value == 'APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES' and entry.FileSystemRights == 1179817) -%}
              {%- set _ = auth.append(entry) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ auth }}

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Set fact for unauthorized accounts (or misconfigured authorized accounts)"
      ansible.builtin.set_fact:
        discovered_au_000515_unauthorized_accounts_with_extra_permissions: >-
          {{
            discovered_au_000515_parsed_acl_entries | map('to_json') | list
            | difference(discovered_au_000515_authorized_entries | map('to_json') | list)
            | map('from_json') | list
          }}

    - name: "MEDIUM | WN10-AU-000515 | AUDIT | Windows 10 permissions for the Application event log must prevent access by non-privileged accounts. | Check for permissions when log location is default"
      when:
        - discovered_au_000515_is_default_location
        - >
          (discovered_au_000515_unauthorized_accounts_with_extra_permissions | length > 0) or

- name: "MEDIUM | WN10-AU-000005 | PATCH | The system must be configured to audit Account Logon - Credential Validation failures"
  when: wn10_au_000005 | bool
  tags:
    - WN10-AU-000005
    - CAT2
    - CCI-000172
    - SRG-OS-000470-GPOS-00214
    - SV-220748r991578_rule
    - V-220748
    - NIST800-53_AU-12_c
    - NIST800-53A_AU-12.1_iv
    - NIST800-53R4_AU-12_c
  block:
    - name: "MEDIUM | WN10-AU-000005 | AUDIT | The system must be configured to audit Account Logon - Credential Validation failures | Get current audit events"
      ansible.windows.win_shell: AuditPol /get /subcategory:"Credential Validation" -r | ConvertFrom-Csv | Select-Object -expand "Inclusion Setting"
      changed_when: false
      failed_when: false
      check_mode: false

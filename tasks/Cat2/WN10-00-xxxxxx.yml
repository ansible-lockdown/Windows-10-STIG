- name: "MEDIUM | WN10-00-000130 | PATCH | Software certificate installation files must be removed from Windows 10."
  when:
    - wn10_00_000130 | bool
    - win10stig_lengthy_search | bool
  tags:
    - WN10-00-000130
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220723r991589_rule
    - V-220723
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-00-000130 | AUDIT | Software certificate installation files must be removed from Windows 10. | Get Drive Letters"
      ansible.windows.win_shell: Get-Volume | Where-Object { $_.DriveType -eq 'Fixed' -and $_.DriveLetter } | Select-Object -ExpandProperty DriveLetter
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000130_drive_letters

    - name: "MEDIUM | WN10-00-000130 | AUDIT | Software certificate installation files must be removed from Windows 10. | Get Drive Letters"
      ansible.builtin.set_fact:
        discovered_00_000130_drive_letters_list: "{{ discovered_00_000130_drive_letters.stdout_lines }}"

    - name: "MEDIUM | WN10-00-000130 | AUDIT | Software certificate installation files must be removed from Windows 10. | Search for files"
      ansible.windows.win_find:
        paths: '{{ item }}:\\'
        recurse: true
        patterns: ['*.p12', '*.pfx']
      loop: "{{ discovered_00_000130_drive_letters_list }}"
      register: discovered_00_000130_files

    - name: "MEDIUM | WN10-00-000130 | AUDIT | Software certificate installation files must be removed from Windows 10. | Filter out excluded certificate files"
      ansible.builtin.set_fact:
        discovered_00_000130_filtered_certificate_files: >-
          {{ discovered_00_000130_files.results | map(attribute='files') | flatten | rejectattr('path', 'search', win10stig_certificate_exclusion_paths | join('|')) | list }}

    - name: "MEDIUM | WN10-00-000130 | PATCH | Software certificate installation files must be removed from Windows 10. | Remove unauthorized certificate installation files"
      changed_when: discovered_00_000130_filtered_certificate_files | length > 0
      when:
        - win10stig_auto_remediate_files
        - discovered_00_000130_filtered_certificate_files | length > 0
      ansible.windows.win_file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ discovered_00_000130_filtered_certificate_files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "MEDIUM | WN10-00-000130 | AUDIT | Software certificate installation files must be removed from Windows 10. | Alert on unauthorized certificate installation files"
      when: not win10stig_auto_remediate_files
      ansible.builtin.debug:
        msg:
          - "Warning!! You have unauthorized .p12 and/or .pfx files on your system."
          - "Please review and remove the following files manually or set"
          - "win10stig_auto_remediate_files: true to remove the files automatically."
          - "{{ discovered_00_000130_filtered_certificate_files | map(attribute='path') | list }}"

    - name: "MEDIUM | WN10-00-000130 | AUDIT | Software certificate installation files must be removed from Windows 10. | Warn Count."
      when: not win10stig_auto_remediate_files
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-00-000130'


      check_mode: false
      register: discovered_00_000135_defender_firewall_check

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Set fact if a firewall is installed"
      ansible.builtin.set_fact:
        discovered_00_000135_firewall_installed: >-
          {{
            (discovered_00_000135_firewall_product_check.stdout | from_json | length > 0) or
            ('"Enabled":1' in discovered_00_000135_defender_firewall_check.stdout)
          }}
        discovered_00_000135_firewall_name: >-
          {{
            (discovered_00_000135_firewall_product_check.stdout | from_json | map(attribute='displayName') | list)
            + (['Windows Defender Firewall'] if '"Enabled":1' in discovered_00_000135_defender_firewall_check.stdout else [])
          }}

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Check if third-party firewall is running (SecurityCenter2)"
      when: discovered_00_000135_firewall_installed | bool
      ansible.windows.win_shell: |
        $firewall = Get-CimInstance -Namespace root\SecurityCenter2 -ClassName FirewallProduct
        if ($firewall -and $firewall.enabled -eq 1) {
          Write-Output "Running"
        } else {
          Write-Output "Not Running"
        }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000135_third_party_firewall_running_status

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Check if Windows Defender Firewall is running"
      when: "'Windows Defender Firewall' in discovered_00_000135_firewall_name"
      ansible.windows.win_shell: |
        $profiles = Get-NetFirewallProfile | Where-Object { $_.Enabled -eq "True" }
        if ($profiles) {
          Write-Output "Running"
        } else {
          Write-Output "Not Running"
        }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000135_defender_firewall_running_status

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Set fact if a firewall is running"
      ansible.builtin.set_fact:
        discovered_00_000135_firewall_running: >-
          {{
            ('Running' in discovered_00_000135_third_party_firewall_running_status.stdout | default(''))
            or ('Running' in discovered_00_000135_defender_firewall_running_status.stdout | default(''))
          }}

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Check Windows Defender Firewall profiles"
      ansible.windows.win_shell: |
        Get-NetFirewallProfile | Select-Object Name, Enabled | ConvertTo-Json -Compress
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000135_defender_profiles

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Parse Windows Defender Firewall profiles"
      ansible.builtin.set_fact:
        discovered_00_000135_defender_profiles_json: "{{ discovered_00_000135_defender_profiles.stdout | from_json }}"

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Extract enabled Windows Defender Firewall profiles"
      ansible.builtin.set_fact:
        discovered_00_000135_enabled_profiles: >-
          {{ discovered_00_000135_defender_profiles_json
             | selectattr('Enabled', 'equalto', 1)
             | map(attribute='Name')
             | list }}

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Check for disabled Windows Defender firewall profiles"
      ansible.builtin.set_fact:
        discovered_00_000135_disabled_profiles: >-
          {{ discovered_00_000135_defender_profiles_json
             | selectattr('Enabled', 'equalto', 0)
             | map(attribute='Name')
             | list }}

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Warning Windows Defender Firewall Profile Status"
      when: discovered_00_000135_disabled_profiles | length > 0
      ansible.builtin.debug:
        msg:
          - "══════════════════════════════════════════════════════════════════════"
          - "                 Windows Defender Firewall Profile Status              "
          - "══════════════════════════════════════════════════════════════════════"
          - "Warning!! One or more Windows Defender Firewall profiles are DISABLED!"
          - "Verify profiles (Domain, Private, Public) are properly Enabled"
          - "and configured to comply with STIG."
          - "----------------------------------------------------------------------"
          - " Domain Profile:  {{ 'Enabled' if 'Domain' in discovered_00_000135_enabled_profiles else 'Disabled' }}"
          - " Private Profile: {{ 'Enabled' if 'Private' in discovered_00_000135_enabled_profiles else 'Disabled' }}"
          - " Public Profile:  {{ 'Enabled' if 'Public' in discovered_00_000135_enabled_profiles else 'Disabled' }}"
          - "----------------------------------------------------------------------"
          - "If any profile is Disabled, notate why and document."
          - "══════════════════════════════════════════════════════════════════════"

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Warn if a firewall is installed but not running"
      when: discovered_00_000135_firewall_installed and not discovered_00_000135_firewall_running | default(false)
      ansible.builtin.debug:
        msg:
          - "Warning!! A firewall is installed but NOT currently running!"
          - "Detected Firewall: {{ discovered_00_000135_firewall_name }}"
          - "Ensure that the firewall is enabled and actively protecting the system."

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Warn if no firewall is detected"
      when:
        - not (discovered_00_000135_firewall_installed | default(false))
        - not (discovered_00_000135_firewall_running | default(false))
      ansible.builtin.debug:
        msg:
          - "Warning!! No active firewall detected!"
          - "Install and enable a host-based firewall to comply with STIG requirements."

    - name: "MEDIUM | WN10-00-000135 | AUDIT | A host-based firewall must be installed and enabled on the system. | Trigger warning facts"
      when: >-
        (not discovered_00_000135_firewall_installed) or
        (discovered_00_000135_firewall_installed and not discovered_00_000135_firewall_running | default(false)) or
        (discovered_00_000135_disabled_profiles | length > 0)
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-00-000135'

- name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts."
  when:
    - wn10_00_000140 | bool
    - discovered_domain_joined | bool
  tags:
    - WN10-00-000140
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-220725r991589_rule
    - V-220725
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Check if any firewall product is installed"
      ansible.windows.win_shell: (Get-CimInstance -Namespace root\SecurityCenter2 -ClassName FirewallProduct) | ConvertTo-Json
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000140_firewall_product_check

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Set fact if a firewall product is installed and store name"
      when: discovered_00_000140_firewall_product_check.stdout | default('') | trim != ''
      ansible.builtin.set_fact:
        discovered_00_000140_firewall_installed: "{{ discovered_00_000140_firewall_product_check.stdout | default('') | trim != '' }}"
        discovered_00_000140_firewall_name: "{{ discovered_00_000140_firewall_product_check.stdout | from_json | map(attribute='displayName') | list }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Check if installed firewall is running"
      when: discovered_00_000140_firewall_installed
      ansible.windows.win_shell: |
        $firewall = Get-CimInstance -Namespace root\SecurityCenter2 -ClassName FirewallProduct
        if ($firewall -and $firewall.enabled -eq 1) {
          Write-Output "Running"
        } else {
          Write-Output "Not Running"
        }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000140_firewall_running_status

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Set fact if a firewall is running"
      when: discovered_00_000140_firewall_installed
      ansible.builtin.set_fact:
        discovered_00_000140_firewall_running: "{{ discovered_00_000140_firewall_running_status.stdout | trim == 'Running' }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Get Windows Defender Firewall inbound rules"
      when: "'Windows Defender Firewall' in discovered_00_000140_firewall_name"
      ansible.windows.win_shell: Get-NetFirewallRule -Direction Inbound -Enabled True | Select-Object Name, DisplayName, Enabled, Direction, Action, Profile, RemoteAddress | ConvertTo-Json -Compress
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000140_inbound_firewall_rules

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Set fact for Windows Defender inbound rules"
      when:
        - discovered_00_000140_inbound_firewall_rules.stdout | default('') | trim != ''
        - "'Windows Defender Firewall' in discovered_00_000140_firewall_name"
      ansible.builtin.set_fact:
        discovered_00_000140_active_inbound_rules: "{{ discovered_00_000140_inbound_firewall_rules.stdout | from_json }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Ensure authorized remote management hosts are defined"
      when: "'Windows Defender Firewall' in discovered_00_000140_firewall_name"
      ansible.builtin.set_fact:
        win10stig_authorized_remote_management_hosts: "{{ win10stig_authorized_remote_management_hosts | default([]) }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Identify unauthorized inbound rules"
      when:
        - "'Windows Defender Firewall' in discovered_00_000140_firewall_name"
        - discovered_00_000140_active_inbound_rules | length > 0
        - win10stig_authorized_remote_management_hosts | length > 0
      ansible.builtin.set_fact:
        discovered_00_000140_unauthorized_inbound_rules: "{{ discovered_00_000140_active_inbound_rules | rejectattr('RemoteAddress', 'search', win10stig_authorized_remote_management_hosts | join('|')) | list }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Set fact to store all inbound rules for manual review if no authorized hosts are defined"
      when:
        - "'Windows Defender Firewall' in discovered_00_000140_firewall_name"
        - discovered_00_000140_active_inbound_rules | length > 0
        - win10stig_authorized_remote_management_hosts | length == 0
      ansible.builtin.set_fact:
        discovered_00_000140_all_inbound_rules_for_review: "{{ discovered_00_000140_active_inbound_rules }}"

    # Auto Remediate
    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Remove unauthorized inbound firewall rules auto remediation"
      when:
        - win10stig_remove_unauthorized_hosts | default(false)
        - discovered_00_000140_unauthorized_inbound_rules | length > 0
      ansible.windows.win_shell: |
        {% for rule in discovered_00_000140_unauthorized_inbound_rules %}
        Remove-NetFirewallRule -Name "{{ rule.Name }}"
        {% endfor %}
      changed_when: true
      failed_when: false
      register: discovered_00_000140_fw_remediation

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Log remediated firewall rules"
      when:
        - win10stig_remove_unauthorized_hosts | bool
        - discovered_00_000140_fw_remediation is changed
      ansible.builtin.debug:
        msg:
          - "Warning!! Unauthorized inbound rules have been removed."
          - "Auto-remediation is !!!! ENABLED !!!! by setting win10stig_remove_unauthorized_hosts"
          - to true. These rules were deleted:"
          - "{{ discovered_00_000140_unauthorized_inbound_rules }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Warning!! Unauthorized inbound firewall rules detected"
      when:
        - "'Windows Defender Firewall' in discovered_00_000140_firewall_name"
        - win10stig_authorized_remote_management_hosts | length > 0
        - discovered_00_000140_unauthorized_inbound_rules | length > 0
        - not win10stig_remove_unauthorized_hosts
      ansible.builtin.debug:
        msg:
          - "Warning!! Unauthorized inbound firewall rules detected!"
          - "These rules allow remote access from unauthorized IPs."
          - "Please check you variable settings to make sure they are correct"
          - "or remove those hosts from the firewall rules."
          - "Unauthorized Rules:"
          - "{{ discovered_00_000140_unauthorized_inbound_rules }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Displaying all inbound firewall rules for manual review"
      when:
        - "'Windows Defender Firewall' in discovered_00_000140_firewall_name"
        - win10stig_authorized_remote_management_hosts | length == 0
        - discovered_00_000140_all_inbound_rules_for_review | length > 0
        - not win10stig_remove_unauthorized_hosts
      ansible.builtin.debug:
        msg:
          - "Warning!! No authorized remote management hosts are defined in"
          - "win10stig_authorized_remote_management_hosts."
          - "Displaying all inbound firewall rules for manual review:"
          - "{{ discovered_00_000140_all_inbound_rules_for_review }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Message if a third-party firewall is used"
      when:
        - discovered_00_000140_firewall_installed
        - "'Windows Defender Firewall' not in discovered_00_000140_firewall_name"
        - not win10stig_remove_unauthorized_hosts
      ansible.builtin.debug:
        msg:
          - "Warning!! A third-party firewall is in use."
          - "If a third-party firewall is used, configure inbound exceptions to ** only include authorized remote management hosts **."
          - "Detected Firewall: {{ discovered_00_000140_firewall_name }}"

    - name: "MEDIUM | WN10-00-000140 | AUDIT | Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management hosts. | Warn Count."
      when: >-
        (win10stig_remove_unauthorized_hosts | bool and discovered_00_000140_fw_remediation is changed) or
        ("Windows Defender Firewall" in discovered_00_000140_firewall_name and
         win10stig_authorized_remote_management_hosts | length > 0 and
         discovered_00_000140_unauthorized_inbound_rules | length > 0 and
         not win10stig_remove_unauthorized_hosts) or
        ("Windows Defender Firewall" in discovered_00_000140_firewall_name and
         win10stig_authorized_remote_management_hosts | length == 0 and
         discovered_00_000140_all_inbound_rules_for_review | length > 0 and
         not win10stig_remove_unauthorized_hosts) or
        (discovered_00_000140_firewall_installed and
         "Windows Defender Firewall" not in discovered_00_000140_firewall_name and
         not win10stig_remove_unauthorized_hosts)
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-00-000140'


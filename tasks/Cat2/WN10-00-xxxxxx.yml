    name: AcceptIncomingRequests
    data: 1
    type: dword

- name: "MEDIUM | WN10-00-000250 | PATCH | Windows 10 nonpersistent VM sessions must not exceed 24 hours."
  when:
    - wn10_00_000250 | bool
    - discovered_vdi_non_persistent | default(false) or discovered_vdi_persistent
  tags:
    - WN10-00-000250
    - CAT2
    - CCI-001199
    - SRG-OS-000185-GPOS-00079
    - SV-220738r958552_rule
    - V-220738
    - NIST800-53_SC-28
    - NIST800-53A_SC-28.1
    - NIST800-53R4_SC-28
  block:
    - name: "MEDIUM | WN10-00-000250 | PATCH | Windows 10 nonpersistent VM sessions must not exceed 24 hours. | Set session timeout set"
      when:
        - win10stig_non_persistent_max_session_timeout | int <= 86400000
        - win10stig_non_persistent_max_session_timeout | length > 0
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Terminal Services
        name: "{{ item.name }}"
        data: "{{ win10stig_non_persistent_max_session_timeout }}"
        type: dword
      loop:
        - { name: "MaxDisconnectionTime" }
        - { name: "MaxIdleTime" }
        - { name: "MaxSessionTime" }
      notify: Change_Requires_Reboot

    - name: "MEDIUM | WN10-00-000250 | AUDIT | Windows 10 nonpersistent VM sessions must not exceed 24 hours. | Warning Message"
      when:
        - win10stig_non_persistent_max_session_timeout | int > 86400000
        - win10stig_non_persistent_max_session_timeout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have invalid setting for win10stig_non_persistent_max_session_timeout please"
          - "make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN10-00-000250 | AUDIT | Windows 10 nonpersistent VM sessions must not exceed 24 hours. | Manual Check."
      when: win10stig_non_persistent_max_session_timeout | length == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! Verify there is a documented policy or procedure in place that nonpersistent VM"
          - "sessions do not exceed 24 hours. If the system is NOT a nonpersistent VM, this is Not Applicable."
          - "For Azure Virtual Desktop (AVD) implementations with no data at rest, this is Not Applicable."
          - "If there is no such documented policy or procedure in place, this is a finding."
          - "To remediate automatically set a value in win10stig_non_persistent_max_session_timeout."

    - name: "MEDIUM | WN10-00-000250 | AUDIT | Windows 10 nonpersistent VM sessions must not exceed 24 hours. | Warn Count."
      when: win10stig_non_persistent_max_session_timeout | int > 86400000 or win10stig_non_persistent_max_session_timeout | length == 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-00-000250'

- name: "MEDIUM | WN10-00-000395 | PATCH | Windows 10 must not have portproxy enabled or in use."
  when: wn10_00_000395 | bool
  tags:
    - WN10-00-000395
    - CAT2
    - CCI-000381
    - SRG-OS-000480-GPOS-00227
    - SV-257593r991589_rule
    - V-257593
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a
  block:
    - name: "MEDIUM | WN10-00-000395 | AUDIT | Windows 10 must not have portproxy enabled or in use. | Check registry for portproxy entries"
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\PortProxy\v4tov4\tcp
      register: discovered_00_000395_portproxy_registry_check

    - name: "MEDIUM | WN10-00-000395 | AUDIT | Windows 10 must not have portproxy enabled or in use. | Get active portproxy rules"
      ansible.windows.win_shell: netsh interface portproxy show all
      check_mode: false
      register: discovered_00_000395_portproxy_netsh_output
      changed_when: false

    - name: "MEDIUM | WN10-00-000395 | AUDIT | Windows 10 must not have portproxy enabled or in use. | Get portproxy rules"
      when: discovered_00_000395_portproxy_netsh_output.stdout_lines | length > 0 and win10stig_delete_each_portproxy and not win10stig_reset_portproxy
      ansible.builtin.set_fact:
        discovered_00_000395_portproxy_rules: >-
          {{
            discovered_00_000395_portproxy_netsh_output.stdout_lines
            | select('match', '^\s*\d{1,3}.*:\d+\s+\d{1,3}.*:\d+')
            | map('regex_replace', '\s+', ' ')
            | map('split', ' ')
            | map('extract', [0,1])
            | list
          }}

    - name: "MEDIUM | WN10-00-000395 | PATCH | Windows 10 must not have portproxy enabled or in use. | Delete individual portproxy rules STIG-compliant method."
      when:
        - win10stig_delete_each_portproxy
        - discovered_00_000395_portproxy_rules is defined
      ansible.windows.win_shell: netsh interface portproxy delete v4tov4 tcp {{ item[0] }}
      loop: "{{ discovered_00_000395_portproxy_rules }}"

    - name: "MEDIUM | WN10-00-000395 | PATCH | Windows 10 must not have portproxy enabled or in use. | Reset all portproxy rules."
      when:
        - win10stig_reset_portproxy
        - not win10stig_delete_each_portproxy
        - discovered_00_000395_portproxy_registry_check.exists or (discovered_00_000395_portproxy_netsh_output.stdout_lines | reject('equalto', '') | list | length > 0)
      ansible.windows.win_shell: netsh interface portproxy reset

    - name: "MEDIUM | WN10-00-000395 | AUDIT | Windows 10 must not have portproxy enabled or in use. | Portproxy Compliance Status with Rule Details"
      when:
        - not win10stig_reset_portproxy
        - not win10stig_delete_each_portproxy
      ansible.builtin.debug:
        msg:
          - "Registry Key Present: {{ discovered_00_000395_portproxy_registry_check.exists }}"
          - "Portproxy Rules Detected: {{ discovered_00_000395_portproxy_netsh_output.stdout_lines | reject('equalto', '') | list | length }}"
          - "{{ 'Finding: Portproxy is enabled or in use.' if (discovered_00_000395_portproxy_registry_check.exists or (discovered_00_000395_portproxy_netsh_output.stdout_lines | reject('equalto', '') | list | length > 0)) else 'Compliant: Portproxy is not in use.' }}"
          - "═══════════════ Current Portproxy Rules (if any) ═══════════════"
          - "{{ discovered_00_000395_portproxy_netsh_output.stdout_lines | reject('equalto', '') | list | default(['None']) }}"

    - name: "MEDIUM | WN10-00-000395 | AUDIT | Windows 10 must not have portproxy enabled or in use. | Warn Count."
      when: discovered_00_000395_portproxy_registry_check.exists or (discovered_00_000395_portproxy_netsh_output.stdout_lines | reject('equalto', '') | list | length > 0)
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-00-000395'


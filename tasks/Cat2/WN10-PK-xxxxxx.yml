          - "═══════════════════════════════════════════════════════"
          - "DoD Root CA 3 (Expiring 11/16/2024) : {{ 'Valid' if discovered_pk_000015_dod_root_3_2024_check.rc == 0 else 'Not Valid (Finding)' }}"
          - "═══════════════════════════════════════════════════════"

    - name: "MEDIUM | WN10-PK-000015 | AUDIT | The DoD Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store on unclassified systems. | Warn Count."

- name: "MEDIUM | WN10-PK-000015 | PATCH | The DoD Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store on unclassified systems."
  when: wn10_pk_000015 | bool
  tags:
    - WN10-PK-000015
    - CAT2
    - CCI-000185
    - CCI-002470
    - SRG-OS-000066-GPOS-00034
    - SV-220905r958448_rule
    - V-220905
    - NIST800-53_IA-5_2
    - NIST800-53A_IA-5_2.1
    - NIST800-53R4_IA-5_2_a
    - NIST800-53R4_SC-25_5
  block:
    - name: "MEDIUM | WN10-PK-000015 | AUDIT | The DoD Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store on unclassified systems. | Check For DoD Root CA 3 (Expiring 11/16/2024)."
      ansible.windows.win_shell: |
        $cert = Get-ChildItem -Path Cert:Localmachine\disallowed |
        Where-Object { $_.Subject -eq "CN=DoD Root CA 3, OU=PKI, OU=DoD, O=U.S. Government, C=US" -and
                        $_.Issuer -eq "CN=DoD Interoperability Root CA 2, OU=PKI, OU=DoD, O=U.S. Government, C=US" -and
                        $_.Thumbprint -eq "49CBE933151872E17C8EAE7F0ABA97FB610F6477" -and
                        $_.NotAfter -eq (Get-Date "11/16/2024") }

        if ($cert) {
            Write-Output "Found: $($cert.Subject) | Issuer: $($cert.Issuer) | Thumbprint: $($cert.Thumbprint) | Expiration: $($cert.NotAfter)"
        } else {
            Write-Output "Missing or Incorrect Certificate: DoD Root CA 3 (Expiring 11/16/2024)"
            exit 1
        }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_pk_000015_dod_root_3_2024_check

    - name: "MEDIUM | WN10-PK-000015 | AUDIT | The DoD Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store on unclassified systems. | Display results and warnings"

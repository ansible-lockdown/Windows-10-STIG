    - SRG-OS-000324-GPOS-00125
    - SV-220956r958726_rule
    - V-220956
    - NIST800-53R4_AC-6_10
  ansible.windows.win_user_right:
    name: SeTrustedCredManAccessPrivilege
    users: []

- name: "MEDIUM | WN10-UR-000010 | PATCH | The Access this computer from the network user right must only be assigned to the Administrators and Remote Desktop Users groups."
  when: wn10_ur_000010 | bool
  tags:
    - WN10-UR-000010
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-220957r1137691_rule
    - V-220957
    - NIST800-53_AC-3
    - NIST800-53A_AC-3.1
    - NIST800-53R4_AC-3
  block:
    - name: "MEDIUM | WN10-UR-000010 | PATCH | The Access this computer from the network user right must only be assigned to the Administrators and Remote Desktop Users groups. | Set Accounts And Groups"
      ansible.windows.win_user_right:
        name: SeNetworkLogonRight
        action: set
        users: "{{ ['Administrators', 'Remote Desktop Users'] + (win10stig_additional_network_logon_users_or_groups | default([])) }}"

    - name: "MEDIUM | WN10-UR-000010 | AUDIT | The Access this computer from the network user right must only be assigned to the Administrators and Remote Desktop Users groups. | Warning Message."
      when: win10stig_additional_network_logon_users_or_groups | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! Additional users or groups have been assigned the Access this computer from the network user right."
          - "If a domain application account such as for a management tool requires this user right, this would not be a finding."
          - "Vendor documentation must support the requirement for having the user right."
          - "The requirement must be documented with the ISSO."
          - "The application account, managed at the domain level, must meet requirements for application account passwords,"
          - "such as length and frequency of changes as defined in the Windows Server STIGs."
          - "Assigned Users/Groups:"
          - "{{ win10stig_additional_network_logon_users_or_groups }}"

    - name: "MEDIUM | WN10-UR-000010 | AUDIT | The Access this computer from the network user right must only be assigned to the Administrators and Remote Desktop Users groups. | Warn Count."
      when: win10stig_additional_network_logon_users_or_groups | length > 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN10-UR-000010'


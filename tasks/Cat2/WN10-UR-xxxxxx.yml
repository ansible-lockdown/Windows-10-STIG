# Older Windows 10 Version Items
# ansible_facts['distribution_version'] < "10.0.1909.0"
#             users:
#               - Administrators
#               - LOCAL SERVICE
# If it is greater then or equal add the following.
#               - NT SERVICE\autotimesvc
- name: "MEDIUM | WN10-UR-000035 | PATCH | The Change the system time user right must only be assigned to Administrators and Local Service and NT SERVICE\\autotimesvc."
  when: wn10_ur_000035 | bool
  tags:
    - WN10-UR-000035
    - CAT2
    - CCI-002235
    - SRG-OS-000324-GPOS-00125
    - SV-220961r958726_rule
    - V-220961
    - NIST800-53R4_AC-6_10
  block:
    - name: "MEDIUM | WN10-UR-000035 | PATCH | The Change the system time user right must only be assigned to Administrators and Local Service and NT SERVICE\\autotimesvc. | Set SeSystemtimePrivilege for Windows 10 < 10.0.1909.0"
      when: ansible_facts['distribution_version'] is version('10.0.1909.0', '<')
      ansible.windows.win_user_right:
        name: SeSystemtimePrivilege
        action: set
        users:
          - Administrators
          - LOCAL SERVICE

    - name: "MEDIUM | WN10-UR-000035 | PATCH | The Change the system time user right must only be assigned to Administrators and Local Service and NT SERVICE\\autotimesvc. | Set SeSystemtimePrivilege for Windows 10 >= 10.0.1909.0"
      when: ansible_facts['distribution_version'] is version('10.0.1909.0', '>=')
      ansible.windows.win_user_right:
        name: SeSystemtimePrivilege
        action: set
        users:
          - Administrators
          - LOCAL SERVICE
          - NT SERVICE\autotimesvc


- name: "MEDIUM | WN10-UR-000070 | PATCH | The Deny access to this computer from the network user right on workstations must be configured to prevent access from highly privileged domain accounts and local accounts on domain systems and unauthenticated access on all systems."
  when: wn10_ur_000070 | bool
  tags:
    - WN10-UR-000070
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-220968r1137691_rule
    - V-220968
    - NIST800-53_AC-3
    - NIST800-53A_AC-3.1
    - NIST800-53R4_AC-3
  block:
    - name: "MEDIUM | WN10-UR-000070 | PATCH | The Deny access to this computer from the network user right on workstations must be configured to prevent access from highly privileged domain accounts and local accounts on domain systems and unauthenticated access on all systems. | Domain member systems"
      when:
        - discovered_domain_joined
        - not win_skip_for_test
        # This right is set to Guests, Enterprise Admins, Domain Admins and Local account, so it
        # removes network logon from every local account AND from the two privileged domain
        # groups. Being a domain principal is not enough to survive it: a Domain Admin is denied
        # as well. Unlike WN10-CC-000037 it also takes SSH with it, because Windows OpenSSH
        # password authentication uses the same logon path, leaving the console as the only way
        # back in. Skipped automatically when the run itself is a local account; the Domain Admin
        # case needs a group membership query the role does not make, so the prelim warning names
        # the requirement instead. See the note in prelim.yml.
        - not discovered_control_account_is_local | bool
      ansible.windows.win_user_right:
        name: SeDenyNetworkLogonRight
        action: set
        users:
          - Guests
          - Enterprise Admins
          - Domain Admins
          - Local account

    - name: "MEDIUM | WN10-UR-000070 | PATCH | The Deny access to this computer from the network user right on workstations must be configured to prevent access from highly privileged domain accounts and local accounts on domain systems and unauthenticated access on all systems. | Non-Domain systems"
      when: not discovered_domain_joined
      ansible.windows.win_user_right:
        name: SeDenyNetworkLogonRight
        users: Guests
        action: set

- name: "MEDIUM | WN10-UR-000075 | PATCH | The \"Deny log on as a batch job\" user right on domain-joined workstations must be configured to prevent access from highly privileged domain accounts."
  when:
    - wn10_ur_000075 | bool
    - discovered_domain_joined | bool
  tags:
    - WN10-UR-000075
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-220969r1137691_rule
    - V-220969
    - NIST800-53_AC-3
    - NIST800-53A_AC-3.1
    - NIST800-53R4_AC-3
  ansible.windows.win_user_right:
    name: SeDenyBatchLogonRight
    action: set
    users:
      # Plural. "Enterprise Admin" and "Domain Admin" are not group names and cannot be
      # translated to a SID, which fails the task and halts the play on a domain joined host.
      - Enterprise Admins
      - Domain Admins

- name: "MEDIUM | WN10-UR-000080 | PATCH | The Deny log on as a service user right on Windows 10 domain-joined workstations must be configured to prevent access from highly privileged domain accounts."
  when:
    - wn10_ur_000080 | bool
    - discovered_domain_joined | bool
  tags:
    - WN10-UR-000080
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-220970r1137691_rule
    - V-220970
    - NIST800-53_AC-3
    - NIST800-53A_AC-3.1
    - NIST800-53R4_AC-3
  ansible.windows.win_user_right:
    name: SeDenyServiceLogonRight
    users:
      # Plural, same reason as the batch logon right above.
      - Enterprise Admins
      - Domain Admins
    action: set

- name: "MEDIUM | WN10-UR-000085 | PATCH | The Deny log on locally user right on workstations must be configured to prevent access from highly privileged domain accounts on domain systems and unauthenticated access on all systems."

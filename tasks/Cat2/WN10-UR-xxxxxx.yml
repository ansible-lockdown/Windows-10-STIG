    - name: "MEDIUM | WN10-UR-000085 | PATCH | The Deny log on locally user right on workstations must be configured to prevent access from highly privileged domain accounts on domain systems and unauthenticated access on all systems. | Non-Domain systems"
      ansible.windows.win_user_right:
        name: SeDenyInteractiveLogonRight
        users: Guests
        action: set
      when: not discovered_domain_joined


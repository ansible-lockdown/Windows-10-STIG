    - SV-220862r958510_rule
    - V-220862
    - NIST800-53_MA-4_c
    - NIST800-53A_MA-4.1_iv
    - NIST800-53R4_MA-4_c
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client
    name: AllowBasic
